<svg viewBox="0 0 900 176" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="176" fill="#fbfaf7"/>
<text x="24" y="22" font-size="13" font-weight="bold" fill="#2b2b2b">A claim has eight parts, each answering its own question, and each can fail while the others hold</text>
<rect x="24" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#5b87ab"/>
<text x="74" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">e</text>
<text x="74" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">evidence</text>
<text x="74" y="84" text-anchor="middle" font-size="7.6" fill="#555">which words, where?</text>
<rect x="24" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="74" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">the quote is not</text>
<text x="74" y="123" text-anchor="middle" font-size="7.8" fill="#a03c3c">in the book</text>
<rect x="132" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#5b87ab"/>
<text x="181" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">s</text>
<text x="181" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">subject</text>
<text x="181" y="84" text-anchor="middle" font-size="7.6" fill="#555">about what?</text>
<rect x="132" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="181" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">wrong thing</text>
<rect x="239" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#5b87ab"/>
<text x="289" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">r</text>
<text x="289" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">relation</text>
<text x="289" y="84" text-anchor="middle" font-size="7.6" fill="#555">says what of it?</text>
<rect x="239" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="289" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">says more than</text>
<text x="289" y="123" text-anchor="middle" font-size="7.8" fill="#a03c3c">the paragraph</text>
<rect x="346" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#5b87ab"/>
<text x="396" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">o</text>
<text x="396" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">object</text>
<text x="396" y="84" text-anchor="middle" font-size="7.6" fill="#555">to what?</text>
<rect x="346" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="396" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">wrong thing</text>
<rect x="454" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#5b87ab"/>
<text x="504" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">a</text>
<text x="504" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">voice</text>
<text x="504" y="84" text-anchor="middle" font-size="7.6" fill="#555">who says so?</text>
<rect x="454" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="504" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">another's voice</text>
<text x="504" y="123" text-anchor="middle" font-size="7.8" fill="#a03c3c">as Jung's</text>
<rect x="562" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#5b87ab"/>
<text x="611" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">m</text>
<text x="611" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">commitment</text>
<text x="611" y="84" text-anchor="middle" font-size="7.6" fill="#555">how firmly?</text>
<rect x="562" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="611" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">a hedge made</text>
<text x="611" y="123" text-anchor="middle" font-size="7.8" fill="#a03c3c">certain</text>
<rect x="669" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#a9925b"/>
<text x="719" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">n</text>
<text x="719" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">normalized</text>
<text x="719" y="84" text-anchor="middle" font-size="7.6" fill="#555">the same, as a verb?</text>
<rect x="669" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="719" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">the verb drifts</text>
<text x="719" y="123" text-anchor="middle" font-size="7.8" fill="#a03c3c">from the string</text>
<rect x="776" y="38" width="100" height="52" rx="4" fill="#fff" stroke="#a9925b"/>
<text x="826" y="58" text-anchor="middle" font-size="15" font-family="Menlo,monospace" fill="#3d6a8c">f</text>
<text x="826" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2b2b">family</text>
<text x="826" y="84" text-anchor="middle" font-size="7.6" fill="#555">what kind of relation?</text>
<rect x="776" y="98" width="100" height="40" rx="4" fill="#f7e9e9" stroke="#a03c3c" stroke-dasharray="3,2"/>
<text x="826" y="112" text-anchor="middle" font-size="7.8" fill="#a03c3c">filed under the</text>
<text x="826" y="123" text-anchor="middle" font-size="7.8" fill="#a03c3c">wrong kind</text>
<text x="24" y="152" font-size="10.5" font-family="Menlo,monospace" fill="#3d6a8c">C = (e, s, r, o, a, m, n, f)</text>
<text x="24" y="168" font-size="9" fill="#6a7480">The order is the order in which the parts are written down. Blue parts are written by the proposer and judged by the gate; gold parts are an overlay, added later and inheriting nothing.</text>
</svg>