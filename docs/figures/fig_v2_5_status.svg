<text x="24" y="346" font-size="10.5" font-family="Menlo,monospace" fill="#3d6a8c">C = (e, s, r, o, a, m, n, f)</text>
<text x="254" y="346" font-size="9" fill="#6a7480">e evidence · s r o subject, relation, object · a voice · m commitment · n normalized relation · f family</text>
<text x="24" y="366" font-size="9" fill="#3f7d3f">● green (3): a control exists and the residual is either measured small in §4 or excluded by construction in §2.</text>
<text x="24" y="379" font-size="9" fill="#b7791f">◐ amber (9): a control exists; the residual is measured and material, or cannot be measured in principle.</text>
<text x="24" y="392" font-size="9" fill="#a03c3c">○ red (1): no control beyond a design choice, and no measurement. Each colour follows from the §3 table's columns, not from a judgement made here.</text>
